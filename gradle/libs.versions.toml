[versions]
agp = "9.6.0-alpha03"
# Pinned. From 1.9.0 ExecutorCoroutineDispatcher implements java.lang.AutoCloseable (API 19), which Dalvik on the
# camera (API 10) can't link, so Dispatchers fails to load and the app dies at launch. 1.3.9 matches the
# OpenMemories compatibility app, which runs on the a7R.
coroutines = "1.3.9"
junit = "4.13.2"
openmemories = "0.3.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

openmemories-framework = { group = "com.github.kungpaogao.OpenMemories-Framework", name = "framework", version.ref = "openmemories" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
