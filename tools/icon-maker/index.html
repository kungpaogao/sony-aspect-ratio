<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon maker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Icon maker</h1>
  <span class="sub">Photo → 72×96 launcher icon, Sony PlayMemories style</span>
</header>

<main>
  <section class="controls" aria-label="Controls">
    <div class="source">
      <label class="btn" for="fileInput">Choose image…</label>
      <input id="fileInput" type="file" accept="image/*" hidden>
      <span id="srcInfo" class="muted">drop or paste an image anywhere</span>
    </div>

    <div id="sliders"></div>

    <div class="row">
      <button id="resetBtn" type="button">Reset all</button>
    </div>

    <div class="actions">
      <button id="downloadBtn" type="button">Download PNG</button>
      <button id="iterBtn" type="button">Save iteration</button>
      <button id="appBtn" type="button" class="primary">Use as app icon</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>

  <section class="previews" aria-label="Previews">
    <div class="panel">
      <h2>On camera <span class="muted">file stretched to a square</span></h2>
      <div class="cam">
        <canvas id="cam1" width="96" height="96"></canvas>
        <canvas id="cam3" width="288" height="288"></canvas>
      </div>
    </div>

    <div class="panel">
      <h2>File <span class="muted">72×96 at 4×</span></h2>
      <canvas id="filePreview" width="72" height="96"></canvas>
    </div>

    <div class="panel wide">
      <h2>Launcher <span class="muted">among Sony's icons</span></h2>
      <div id="strip" class="strip"></div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
